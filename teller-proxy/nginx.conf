# Internal-only proxy that adds your Teller client certificate (mTLS).
# PocketBase calls http://teller-proxy:8080/... and this forwards to https://api.teller.io.
worker_processes 1;
events { worker_connections 64; }
http {
  access_log off;
  resolver 127.0.0.11 valid=60s ipv6=off;
  server {
    listen 8080;
    location / {
      set $teller https://api.teller.io;
      proxy_pass $teller;
      proxy_set_header Host api.teller.io;
      proxy_ssl_server_name on;
      proxy_ssl_name api.teller.io;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_ssl_certificate /certs/certificate.pem;
      proxy_ssl_certificate_key /certs/private_key.pem;
      proxy_read_timeout 120s;
    }
  }
}
